<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你的名字 · UX/UI 作品集</title>
<style>
/* ========== 设计变量（改这里可以全局换主题色） ========== */
:root{
  --bg:#FFFFFF;          /* 页面底色 */
  --ink:#1A1A1A;         /* 主文字 */
  --ink-2:#5A5A55;       /* 次级文字 */
  --line:rgba(26,26,26,.09);   /* 分隔线（玻璃风用半透明） */
  --accent:#1e4fe8;      /* 强调色（品牌蓝） */
  --accent-soft:rgba(30,79,232,.09);
  --radius:20px;
  --maxw:1120px;

  /* 毛玻璃配方 */
  --glass-bg:rgba(255,255,255,.52);
  --glass-bg-strong:rgba(255,255,255,.68);
  --glass-border:rgba(255,255,255,.7);
  --glass-shadow:0 8px 32px rgba(31,38,135,.07);
  --nav-bg:rgba(255,255,255,.55);
  --muted:#A3A29B;
}
[data-theme="dark"]{
  --bg:#0E1015;
  --ink:#EDEDF0;
  --ink-2:#9CA0AA;
  --line:rgba(255,255,255,.1);
  --accent:#5B86F5;
  --accent-soft:rgba(91,134,245,.14);
  --glass-bg:rgba(22,25,34,.55);
  --glass-bg-strong:rgba(30,34,46,.72);
  --glass-border:rgba(255,255,255,.09);
  --glass-shadow:0 8px 32px rgba(0,0,0,.45);
  --nav-bg:rgba(14,16,21,.55);
  --muted:#6B6E78;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.75;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.container{max-width:var(--maxw);margin:0 auto;padding:0 24px}

/* ========== 通用毛玻璃类 ========== */
.glass{
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);
  backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
}

/* ========== 首屏流动光斑 ========== */
.blobs{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blob{
  position:absolute;border-radius:50%;
  filter:blur(90px);opacity:.5;will-change:transform;
  animation:drift ease-in-out infinite alternate;
}
.blob.b1{width:640px;height:580px;top:-160px;left:-120px;
  background:radial-gradient(circle at 30% 30%, #3B82F6, rgba(59,130,246,0) 70%);
  animation-duration:5.5s}
.blob.b2{width:400px;height:460px;top:-80px;right:-100px;
  background:radial-gradient(circle at 60% 40%, #34D399, rgba(52,211,153,0) 70%);
  animation-duration:5s;animation-delay:-1.5s}
.blob.b3{width:520px;height:470px;bottom:-180px;left:30%;
  background:radial-gradient(circle at 50% 50%, #FB923C, rgba(251,146,60,0) 70%);
  animation-duration:6.5s;animation-delay:-3s}
.blob.b4{width:360px;height:420px;top:20%;left:55%;
  background:radial-gradient(circle at 40% 60%, #A78BFA, rgba(167,139,250,0) 70%);
  animation-duration:5s;animation-delay:-4s}
@keyframes drift{
  0%  {transform:translate(0,0) scale(1) rotate(0deg)}
  50% {transform:translate(100px,70px) scale(1.18) rotate(14deg)}
  100%{transform:translate(-70px,120px) scale(.92) rotate(-12deg)}
}

/* ========== 导航 ========== */
.nav{
  position:sticky;top:0;z-index:50;
  background:var(--nav-bg);
  -webkit-backdrop-filter:blur(20px) saturate(1.6);
  backdrop-filter:blur(20px) saturate(1.6);
  border-bottom:1px solid var(--glass-border);
}
.nav-inner{max-width:var(--maxw);margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.nav-left,.nav-right{display:flex;align-items:center;gap:12px}
.theme-toggle{
  width:38px;height:38px;border-radius:99px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--glass-bg);
  border:1px solid rgba(26,26,26,.12);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  color:var(--ink);transition:.2s;padding:0;
}
.theme-toggle:hover{border-color:var(--ink)}
[data-theme="dark"] .theme-toggle{border-color:rgba(255,255,255,.18)}
.logo{font-weight:700;font-size:17px;letter-spacing:.5px}
.logo span{color:var(--accent)}
.nav-links{display:flex;gap:28px;font-size:14.5px;color:var(--ink-2)}
.nav-links a:hover{color:var(--ink)}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--accent);color:#fff;font-size:14.5px;
  height:38px;padding:0 18px;border-radius:99px;transition:.2s;
  border:1px solid transparent;
}
.btn:hover{background:#1a45c7}
.btn.ghost{
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  color:var(--ink);border:1px solid rgba(26,26,26,.12);
}
.btn.ghost:hover{border-color:var(--ink)}
[data-theme="dark"] .btn.ghost{border-color:rgba(255,255,255,.18)}
[data-theme="dark"] .btn{background:var(--accent);color:#fff}

/* ========== Hero ========== */
.hero{position:relative;padding:130px 0 100px;overflow:hidden}
.hero .container{position:relative;z-index:1}
.hero .tag{
  display:inline-block;font-size:13px;color:var(--accent);
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);
  padding:6px 16px;border-radius:99px;margin-bottom:24px;
}
.hero h1{font-size:clamp(38px,6vw,64px);line-height:1.2;letter-spacing:-1px;font-weight:750;max-width:820px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin-top:22px;font-size:18px;color:var(--ink-2);max-width:600px}
.hero .hero-actions{margin-top:36px;display:flex;gap:14px;flex-wrap:wrap}

/* ========== 章节标题 ========== */
.section{padding:90px 0;position:relative}
.section-head{margin-bottom:56px}
.section-head .no{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:2px}
.section-head h2{font-size:clamp(28px,4vw,40px);letter-spacing:-.5px;margin-top:8px}

/* ========== 作品卡片 ========== */
.works-wrap{position:relative}
.works{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x proximity;padding:40px 24px;scrollbar-width:none}
.works::-webkit-scrollbar{display:none}
.work-card{flex:0 0 calc(33.333% - 14px);min-width:300px;scroll-snap-align:start}
.work-card{
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  border-radius:var(--radius);
  overflow:hidden;transition:.25s;cursor:pointer;display:flex;flex-direction:column;
}
.work-card:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(31,38,135,.12);border-color:var(--glass-border)}
.work-card .cover{aspect-ratio:16/9;position:relative;overflow:hidden}
.work-card .cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.95);font-size:14px;letter-spacing:1px;background-size:cover;background-position:center}
.work-card .body{padding:20px 22px 22px}
.work-card .meta{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 12px;border-radius:99px;background:rgba(30,79,232,.12);color:var(--accent);font-weight:500;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(30,79,232,.15)}
.chip.gray{background:var(--glass-bg);color:var(--ink-2);border:1px solid rgba(26,26,26,.08)}
.work-card h3{font-size:19px;letter-spacing:-.3px}
.work-card p{font-size:13.5px;color:var(--ink-2);margin-top:6px;line-height:1.6}
.work-card .more{margin-top:12px;font-size:13.5px;font-weight:600;color:var(--accent)}

/* 轮播箭头 */
.works-arrow{width:38px;height:38px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  background:var(--glass-bg);border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  color:var(--ink);transition:.2s;box-shadow:var(--glass-shadow)}
.works-arrow:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 分类 tabs */
.cat-tabs{display:flex;gap:8px;margin:0 0 8px;flex-wrap:wrap}
.cat-tab{padding:6px 16px;border-radius:99px;font-size:13px;cursor:pointer;
  background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--ink-2);transition:.2s}
.cat-tab:hover{border-color:var(--ink)}
.cat-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 胶囊滚动指示 */
.scroll-pill{position:relative;width:120px;height:4px;margin:14px auto 0;cursor:pointer}
.scroll-pill-track{position:absolute;inset:0;background:rgba(0,0,0,.08);border-radius:2px}
.scroll-pill-thumb{position:absolute;top:0;left:0;height:100%;width:40%;background:var(--accent);border-radius:2px;transition:left .3s ease}

/* ========== 关于我 ========== */
.about-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:64px;align-items:start}
.about-grid .portrait{aspect-ratio:0;border-radius:var(--radius);display:flex;align-items:flex-end;padding:20px;color:#1e4fe8;font-size:13px;
  background:linear-gradient(135deg,rgba(191,208,255,.85),rgba(147,180,255,.85));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.8);box-shadow:var(--glass-shadow);
  width: 300px;
  height: 300px;
  margin: 0 auto;
  max-width:360px;justify-self:end}

.about-grid h3{font-size:24px;margin-bottom:16px}
.about-grid p{color:var(--ink-2);font-size:15.5px;margin-bottom:14px}
.skill-groups{margin-top:28px;display:grid;gap:20px}
.skill-group h4{font-size:13px;color:var(--ink-2);letter-spacing:1px;margin-bottom:8px}
.skill-group .items{display:flex;gap:8px;flex-wrap:wrap}
.skill-group .items span{font-size:13.5px;padding:6px 14px;border-radius:99px;
  background:var(--glass-bg);border:1px solid rgba(26,26,26,.08);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* ========== 联系 ========== */
.footer{padding:90px 0 60px;text-align:center;position:relative}
.footer h2{font-size:clamp(28px,4vw,44px);letter-spacing:-.5px}
.footer p{color:var(--ink-2);margin:14px 0 30px}
.footer .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.footer .copyright{margin-top:60px;font-size:13px;color:var(--muted)}

/* ========== 案例页 ========== */
.case-hero{position:relative;padding:90px 0 60px;overflow:hidden}
.case-hero .container{position:relative;z-index:1}
.case-hero .back{font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;margin-bottom:36px}
.case-hero .back:hover{color:var(--accent)}
.case-hero h1{font-size:clamp(34px,5vw,54px);letter-spacing:-1px;line-height:1.2;max-width:800px}
.case-hero .lead{font-size:18px;color:var(--ink-2);margin-top:18px;max-width:680px}
.facts{
  margin-top:44px;display:grid;grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.facts div{padding:22px 8px;border-right:1px solid var(--line)}
.facts div:last-child{border-right:none}
.facts .k{font-size:12px;color:var(--ink-2);letter-spacing:1px}
.facts .v{font-size:15px;font-weight:600;margin-top:4px}

.case-body{padding:30px 0 90px}
.chapter{padding:64px 0;border-bottom:1px dashed var(--line)}
.chapter:last-child{border-bottom:none}
.chapter .ch-no{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:2px}
.chapter h2{font-size:clamp(24px,3.4vw,34px);letter-spacing:-.5px;margin:10px 0 8px}
.chapter .ch-lead{font-size:16.5px;color:var(--ink-2);max-width:640px;margin-bottom:32px}
.chapter h3{font-size:17.5px;margin:36px 0 14px}
.chapter p{font-size:15.5px;color:var(--ink);max-width:720px;margin-bottom:14px}
.chapter ul{margin:0 0 16px 20px;color:var(--ink);font-size:15.5px}
.chapter li{margin-bottom:8px}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin:28px 0}
.panel{border-radius:var(--radius);padding:28px;
  background:var(--glass-bg);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
.panel h4{font-size:15px;margin-bottom:8px}
.panel .big{font-size:34px;font-weight:750;letter-spacing:-1px;color:var(--accent)}
.panel .desc{font-size:14px;color:var(--ink-2);margin-top:6px}

.findings{display:grid;gap:14px;margin:24px 0}
.finding{display:flex;gap:18px;border-radius:14px;padding:20px 24px;
  background:var(--glass-bg);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
.finding .num{flex-shrink:0;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
  background:rgba(30,79,232,.12);color:var(--accent);border:1px solid rgba(30,79,232,.18)}
.finding p{font-size:14.5px;color:var(--ink);margin:0}
.finding strong{color:var(--ink)}

.iter{margin:32px 0;display:grid;grid-template-columns:110px 1fr;gap:24px;align-items:start}
.iter .badge{position:sticky;top:90px}
.iter .badge span{display:inline-block;font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:99px;
  background:var(--glass-bg);color:var(--ink-2);border:1px solid rgba(26,26,26,.08);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.iter .badge span.rejected{background:rgba(254,226,226,.7);color:#DC2626;border:1px solid rgba(220,38,38,.15)}
.iter .badge span.shipped{background:rgba(220,252,231,.7);color:#16A34A;border:1px solid rgba(22,163,74,.15)}
.iter .content{border-radius:var(--radius);padding:26px 28px;
  background:var(--glass-bg);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
.iter .content h4{font-size:16.5px;margin-bottom:10px}
.iter .content p{font-size:14.5px;color:var(--ink-2);margin-bottom:12px}
.iter .content .lesson{font-size:14px;color:var(--ink);background:rgba(30,79,232,.09);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0}

.wire{
  margin-top:16px;border:1px dashed rgba(26,26,26,.18);border-radius:10px;
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  aspect-ratio:16/5;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;text-align:center;padding:12px;
}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0}
.metric{border-radius:14px;padding:24px 22px;
  background:var(--glass-bg);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
.metric .from{font-size:13px;color:var(--muted);text-decoration:line-through}
.metric .to{font-size:30px;font-weight:750;letter-spacing:-1px;margin-top:4px}
.metric .to em{font-style:normal;color:var(--accent);font-size:15px;font-weight:600;margin-left:6px}
.metric .label{font-size:13px;color:var(--ink-2);margin-top:6px}

.quote{
  margin:28px 0;padding:28px 32px;border-left:3px solid var(--accent);border-radius:0 14px 14px 0;
  background:rgba(30,79,232,.07);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  font-size:16px;color:var(--ink);
}
.quote small{display:block;margin-top:10px;font-size:13px;color:var(--ink-2)}

.case-nav{display:flex;justify-content:space-between;padding:40px 0 0;font-size:14.5px;font-weight:600}
.case-nav a{color:var(--ink-2)}
.case-nav a:hover{color:var(--accent)}

[data-page]{display:none}
[data-page].active{display:block}

@media (max-width:820px){
  .work-card{flex:0 0 85%}
  .works-arrow{display:none}
  .about-grid{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,1fr)}
  .facts div:nth-child(2){border-right:none}
  .facts div:nth-child(1),.facts div:nth-child(2){border-bottom:1px solid var(--line)}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .two-col{grid-template-columns:1fr}
  .iter{grid-template-columns:1fr}
  .iter .badge{position:static}
  .nav-links{display:none}
  .blob{filter:blur(60px);opacity:.42}
}
@media (prefers-reduced-motion:reduce){
  .blob{animation:none}
}
</style>
<base target="_blank">

<body>

<!-- ================= 导航 ================= -->
<nav class="nav">
  <div class="nav-inner">
    <a class="logo" href="#" onclick="go('home');return false;">你的名字<span>.</span></a>
    <div class="nav-links">
      <a href="#" onclick="go('home','works');return false;">作品</a>
      <a href="#" onclick="go('home','about');return false;">关于</a>
      <a href="#" onclick="go('home','contact');return false;">联系</a>
    </div>
    <div class="nav-right">
      <a class="btn" id="emailBtn" href="mailto:you@example.com"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>联系我</a>
      <a class="theme-toggle" href="admin.html" aria-label="后台管理"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
      <button class="theme-toggle" id="themeToggle" aria-label="切换深浅色模式"></button>
    </div>
  </div>
</nav>

<!-- ================= 首页 ================= -->
<main data-page="home" class="active">

  <!-- Hero：一句话定位 + 流动光斑背景 -->
  <section class="hero">
    <div class="blobs">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="blob b4"></div>
    </div>
    <div class="container">
      <span class="tag" id="heroTag"></span>
      <h1><span id="heroTitleBefore"></span><br>做成<em id="heroTitleEm"></em><span id="heroTitleAfter"></span></h1>
      <p id="heroIntro"></p>
      <div class="hero-actions">
        <a class="btn" href="#" onclick="go('home','works');return false;">查看案例 ↓</a>
        <a class="btn ghost" id="heroEmail" href="mailto:you@example.com">you@example.com</a>
      </div>
    </div>
  </section>

  <!-- 精选作品 -->
  <section class="section" id="works">
    <div class="container">
      <div class="section-head" style="display:flex;justify-content:space-between;align-items:flex-end">
        <div>
          <div class="no">SELECTED WORK</div>
          <h2>精选案例</h2>
        </div>
        <div style="display:flex;gap:10px">
          <div class="works-arrow" onclick="scrollWorks(-1)">‹</div>
          <div class="works-arrow" onclick="scrollWorks(1)">›</div>
        </div>
      </div>
      <div class="cat-tabs" id="catTabs"></div>
      <div class="works-wrap">
        <div class="works" id="worksList"></div>
        <div class="scroll-pill" id="worksPill">
          <div class="scroll-pill-track"></div>
          <div class="scroll-pill-thumb" id="worksPillThumb"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 关于我 -->
  <section class="section" id="about">
    <div class="container">
      <div class="section-head">
        <div class="no">ABOUT</div>
        <h2>关于我</h2>
      </div>
      <div class="about-grid">
        <div>
          <h3 id="aboutGreeting"></h3>
          <div id="aboutParagraphs"></div>
          <div class="skill-groups" id="skillGroups"></div>
        </div>
        <div class="portrait" id="aboutPortrait">[ 这里放一张你的职业形象照 ]</div>
      </div>
    </div>
  </section>

  <!-- 联系 -->
  <footer class="footer" id="contact">
    <div class="container">
      <h2><span id="contactLine1"></span><br><span id="contactLine2"></span></h2>
      <p id="contactNote"></p>
      <div class="links">
        <a class="btn" id="footerEmail" href="mailto:you@example.com">you@example.com</a>
        <a class="btn ghost" id="footerWechat" href="#">微信</a>
        <a class="btn ghost" id="footerResume" href="#">下载简历</a>
      </div>
      <div class="copyright">© 2026 <span id="footerName"></span> · 设计与文字均为原创，转载请注明出处</div>
    </div>
  </footer>

</main>

<!-- ================= 案例页（动态渲染） ================= -->
<main data-page="case">
  <div id="caseRoot"></div>
</main>

<script>
/* 极简单页路由：切换 data-page 显示 */
function go(page, anchor){
  document.querySelectorAll('[data-page]').forEach(function(el){
    el.classList.toggle('active', el.dataset.page === page);
  });
  window.scrollTo({top:0, behavior:'instant'});
  if(anchor){
    setTimeout(function(){
      var t = document.getElementById(anchor);
      if(t) t.scrollIntoView({behavior:'smooth'});
    }, 50);
  }
}

/* ============ 从后台数据渲染内容 ============ */
function hexToRgba(hex, a){
  hex = (hex||'').replace('#','');
  if(hex.length !== 6) return hex;
  var r = parseInt(hex.substr(0,2),16),
      g = parseInt(hex.substr(2,2),16),
      b = parseInt(hex.substr(4,2),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function setText(id, v){ var el=document.getElementById(id); if(el) el.textContent = v||''; }

function applyData(data){
  if(!data) return;
  var root = document.documentElement;
  var site = data.site||{};
  var hero = data.hero||{};
  var about = data.about||{};
  var contact = data.contact||{};

  /* 主色调 */
  if(site.themeColor){
    root.style.setProperty('--accent', site.themeColor);
    root.style.setProperty('--accent-soft', hexToRgba(site.themeColor, .09));
  }

  /* 顶部 */
  setText('heroTag', site.location);
  setText('heroTitleBefore', hero.titleBefore);
  setText('heroTitleEm', hero.titleEm);
  setText('heroTitleAfter', hero.titleAfter);
  setText('heroIntro', hero.intro);
  document.title = (site.name||'作品集') + ' · UX/UI';

  /* 邮件链接 */
  ['emailBtn','heroEmail','footerEmail'].forEach(function(id){
    var el = document.getElementById(id);
    if(el && site.email){ el.href = 'mailto:'+site.email; }
  });
  if(site.email) setText('footerEmail', site.email);
  if(site.email) setText('heroEmail', site.email);

  /* 作品列表 */
  window.__DATA = data;
  window.__cat = '全部';
  renderCatTabs(data.works||[]);
  renderWorksList(data.works||[]);

  /* 关于我 */
  setText('aboutGreeting', about.greeting);
  var ap = document.getElementById('aboutParagraphs');
  if(ap) ap.innerHTML = (about.paragraphs||[]).map(function(p){return '<p>'+p+'</p>';}).join('');
  var pg = document.getElementById('aboutPortrait');
  if(pg){
    if(about.portraitImage){
      pg.style.backgroundImage = 'url('+about.portraitImage+')';
      pg.style.backgroundSize = 'cover';
      pg.style.backgroundPosition = 'center';
      pg.textContent = '';
    }
  }
  var sg = document.getElementById('skillGroups');
  if(sg) sg.innerHTML = (about.skillGroups||[]).map(function(g){
    return '<div class="skill-group"><h4>'+g.name+'</h4><div class="items">'+
      (g.items||[]).map(function(i){return '<span>'+i+'</span>';}).join('')+
      '</div></div>';
  }).join('');

  /* 联系 */
  setText('contactLine1', contact.line1);
  setText('contactLine2', contact.line2);
  setText('contactNote', contact.note);
  setText('footerWechat', contact.wechat ? '微信' : '微信');
  setText('footerName', site.name);
  var wc = document.getElementById('footerWechat');
  if(wc && contact.wechat){ wc.onclick = function(e){ e.preventDefault(); alert(contact.wechat); }; }
  var rc = document.getElementById('footerResume');
  if(rc && contact.resumeUrl){ rc.href = contact.resumeUrl; }
}

var CATEGORIES = ['全部','PC端设计','移动端','Logo设计','插画设计','交互动画','其他'];
function renderCatTabs(works){
  var box = document.getElementById('catTabs');
  if(!box) return;
  box.innerHTML = CATEGORIES.map(function(c){
    return '<div class="cat-tab'+(c===window.__cat?' active':'')+'" onclick="filterCat(\''+c+'\')">'+c+'</div>';
  }).join('');
}
function filterCat(c){
  window.__cat = c;
  renderCatTabs(window.__DATA.works||[]);
  renderWorksList(window.__DATA.works||[]);
}
function renderWorksList(works){
  var box = document.getElementById('worksList');
  if(!box) return;
  var list = window.__cat==='全部' ? works : works.filter(function(w){return w.category===window.__cat;});
  if(!list.length){ box.innerHTML = '<div style="padding:40px;color:var(--ink-2);font-size:14px">暂无此类作品</div>'; return; }
  box.innerHTML = list.map(function(w){
    var i = (window.__DATA.works||[]).indexOf(w);
    var chips = (w.tags||[]).map(function(t, j){
      return '<span class="chip'+(j>0?' gray':'')+'">'+t+'</span>';
    }).join('');
    var coverInner;
    if(w.coverType === 'video' && w.coverVideo){
      coverInner = '<video src="'+w.coverVideo+'" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover"></video>';
    } else if(w.coverImage){
      coverInner = '<div class="ph" style="background-image:url('+w.coverImage+');background-size:cover;background-position:center"></div>';
    } else {
      coverInner = '<div class="ph" style="background:'+w.cover+'">'+(w.ph||'')+'</div>';
    }
    return '<article class="work-card" onclick="openCase('+i+')">'+
      '<div class="cover">'+coverInner+'</div>'+
      '<div class="body"><div class="meta">'+chips+'<span class="chip gray">'+(w.year||'')+'</span></div>'+
      '<h3>'+w.title+'</h3><p>'+w.summary+'</p>'+
      '<div class="more">查看完整案例 →</div></div></article>';
  }).join('');
}

function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function openCase(i){
  var w = (window.__DATA && window.__DATA.works && window.__DATA.works[i]);
  if(!w){ return; }
  go('case');
  renderCase(w);
}

function renderCase(w){
  var root = document.getElementById('caseRoot');
  var c = w.case;
  if(!c){
    root.innerHTML = '<section class="case-hero"><div class="container">'+
      '<a class="back" href="#" onclick="go(\'home\',\'works\');return false;">← 返回全部作品</a>'+
      '<h1>'+esc(w.title)+'</h1><p class="lead">该案例详情正在整理中。</p></div></section>';
    return;
  }
  var facts = (c.facts||[]).map(function(f){
    return '<div><div class="k">'+esc(f.k)+'</div><div class="v">'+esc(f.v)+'</div></div>';
  }).join('');
  var chapters = (c.chapters||[]).map(function(ch){
    var paras = (ch.paragraphs||[]).map(function(p){return '<p>'+esc(p)+'</p>';}).join('');
    var img = ch.image ? '<div style="margin:18px 0;border-radius:14px;overflow:hidden"><img src="'+esc(ch.image)+'" style="width:100%;display:block"></div>' : '';
    var panels = (ch.panels||[]).map(function(p){
      return '<div class="panel"><h4>'+esc(p.h)+'</h4>'+
        (p.big?'<div class="big">'+esc(p.big)+'</div>':'')+
        '<div class="desc">'+esc(p.desc).replace(/\n/g,'<br>')+'</div></div>';
    }).join('');
    var twoCol = panels ? '<div class="two-col">'+panels+'</div>' : '';
    return '<section class="chapter">'+
      '<div class="ch-no">'+esc(ch.no)+'</div>'+
      '<h2>'+esc(ch.title)+'</h2>'+
      '<p class="ch-lead">'+esc(ch.lead)+'</p>'+
      paras + img + twoCol +
    '</section>';
  }).join('');
  var metrics = (c.metrics||[]).map(function(m){
    return '<div class="metric"><div class="from">'+esc(m.from)+'</div>'+
      '<div class="to">'+esc(m.to)+'<em>'+esc(m.em)+'</em></div>'+
      '<div class="label">'+esc(m.label)+'</div></div>';
  }).join('');
  var quote = c.quote ? '<div class="quote">"'+esc(c.quote.text)+'"<small>—— '+esc(c.quote.from)+'</small></div>' : '';

  var coverMedia = '';
  if(w.coverType === 'video' && w.coverVideo){
    coverMedia = '<div style="margin:28px 0 0;border-radius:16px;overflow:hidden;box-shadow:var(--glass-shadow)"><video src="'+esc(w.coverVideo)+'" autoplay muted loop playsinline style="width:100%;display:block"></video></div>';
  } else if(w.coverImage){
    coverMedia = '<div style="margin:28px 0 0;border-radius:16px;overflow:hidden;box-shadow:var(--glass-shadow)"><img src="'+esc(w.coverImage)+'" style="width:100%;display:block"></div>';
  }

  root.innerHTML =
    '<section class="case-hero">'+
      '<div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b4"></div></div>'+
      '<div class="container">'+
        '<a class="back" href="#" onclick="go(\'home\',\'works\');return false;">← 返回全部作品</a>'+
        '<h1>'+esc(c.heroTitle||w.title)+'</h1>'+
        '<p class="lead">'+esc(c.lead)+'</p>'+
        '<div class="facts">'+facts+'</div>'+
        coverMedia+
      '</div>'+
    '</section>'+
    '<div class="container case-body">'+
      chapters +
      (metrics?'<div class="metrics">'+metrics+'</div>':'')+
      quote +
      '<div class="case-nav">'+
        '<a href="#" onclick="go(\'home\',\'works\');return false;">全部作品</a>'+
      '</div>'+
    '</div>';
}

function loadData(){
  fetch('/api/data').then(function(r){return r.json();}).then(applyData).catch(function(){});
}

/* 作品横向滚动 */
function scrollWorks(dir){
  var box = document.getElementById('worksList');
  if(!box) return;
  var card = box.querySelector('.work-card');
  if(!card) return;
  box.scrollBy({left: dir * (card.offsetWidth + 20), behavior:'smooth'});
}
function updatePill(){
  var box = document.getElementById('worksList');
  var thumb = document.getElementById('worksPillThumb');
  if(!box || !thumb) return;
  var max = box.scrollWidth - box.clientWidth;
  var ratio = max > 0 ? box.scrollLeft / max : 0;
  var trackW = 120;
  var thumbW = thumb.offsetWidth || 48;
  thumb.style.left = (ratio * (trackW - thumbW)) + 'px';
}
var autoTimer = null;
function stopAutoScroll(){ if(autoTimer){ clearInterval(autoTimer); autoTimer = null; } }
function startAutoScroll(){
  stopAutoScroll();
  var box = document.getElementById('worksList');
  if(!box) return;
  autoTimer = setInterval(function(){
    var max = box.scrollWidth - box.clientWidth - 10;
    if(box.scrollLeft >= max){ box.scrollTo({left:0, behavior:'smooth'}); }
    else { scrollWorks(1); }
  }, 5000);
}
function initWorksScroll(){
  var box = document.getElementById('worksList');
  if(!box) return;
  box.addEventListener('scroll', updatePill);
  box.addEventListener('mouseenter', stopAutoScroll);
  box.addEventListener('mouseleave', startAutoScroll);
  var pill = document.getElementById('worksPill');
  if(pill){
    pill.addEventListener('click', function(e){
      var rect = pill.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var max = box.scrollWidth - box.clientWidth;
      box.scrollTo({left: max * (x/rect.width), behavior:'smooth'});
    });
  }
}

/* 深浅色主题切换 */
(function(){
  var root = document.documentElement;
  var btn = document.getElementById('themeToggle');
  var sun = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var moon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
  function apply(t){
    root.setAttribute('data-theme', t);
    btn.innerHTML = t === 'dark' ? sun : moon;
    try{ localStorage.setItem('pf-theme', t); }catch(e){}
  }
  var init = 'light';
  try{
    init = localStorage.getItem('pf-theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }catch(e){}
  apply(init);
  btn.addEventListener('click', function(){
    apply(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
})();

/* 启动加载数据 */
loadData();
setTimeout(function(){ initWorksScroll(); startAutoScroll(); updatePill(); }, 300);
</script>
</body>
</html>
